name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (tag v1.0.0 is created)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PICURE_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Normalize version
        run: echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"

      - name: Stamp release version into the app
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.TAG.slice(1);
            app.expo.android = { ...app.expo.android, versionCode: Number(process.env.RUN_NUMBER) };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --runInBand

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/picure.jks"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/picure.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Picure-$TAG.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "Picure-$TAG.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Picure ${{ env.TAG }}
          generate_release_notes: true
          files: Picure-${{ env.TAG }}.apk
